<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Katherine's To-Do</title>
    <link rel="icon" type="image/x-icon" href="todo.png">
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container py-4">

        <h1 class="text-center mb-4">🌟 Katherine's To-Do List 🌟</h1>
        <h3></h3>

        <!-- Create Task Section -->
        <section class="card create-card shadow p-4 mb-4">
            <h3>Create a New Task 🎨</h3>

            <div class="mb-3">
                <input type="text" id="title" class="form-control form-control-lg"
                    placeholder="What do you want to do today?">
            </div>

            <!-- Dynamic Tags Container -->
            <div id="tagButtons" class="mb-3">
                <!-- Tags will be injected here from backend -->
            </div>

            <button onclick="createTask()" class="btn btn-primary btn-lg">
                ➕ Add Task
            </button>
        </section>

        <!-- Week Tabs -->
        <ul class="nav nav-tabs week-tabs" id="weekTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#thisWeek" type="button" role="tab">
                    🌟 This Week
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#lastWeek" type="button" role="tab">
                    📅 Last Week
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#twoWeeksAgo" type="button" role="tab">
                    🗓️ Two Weeks Ago
                </button>
            </li>
        </ul>

        <div class="tab-content tab-body" id="weekTabContent">

            <!-- This Week -->
            <div class="tab-pane fade show active" id="thisWeek" role="tabpanel">
                <h2 class="section-title text-success">⭐ Tasks To Do</h2>
                <div id="thisWeekActive" class="row"></div>
                <h2 class="section-title text-muted">🎉 Completed</h2>
                <div id="thisWeekCompleted" class="row"></div>
            </div>

            <!-- Last Week -->
            <div class="tab-pane fade" id="lastWeek" role="tabpanel">
                <h2 class="section-title text-success">⭐ Tasks To Do</h2>
                <div id="lastWeekActive" class="row"></div>
                <h2 class="section-title text-muted">🎉 Completed</h2>
                <div id="lastWeekCompleted" class="row"></div>
            </div>

            <!-- Two Weeks Ago -->
            <div class="tab-pane fade" id="twoWeeksAgo" role="tabpanel">
                <h2 class="section-title text-success">⭐ Tasks To Do</h2>
                <div id="twoWeeksAgoActive" class="row"></div>
                <h2 class="section-title text-muted">🎉 Completed</h2>
                <div id="twoWeeksAgoCompleted" class="row"></div>
            </div>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>

</html>
