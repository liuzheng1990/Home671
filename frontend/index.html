<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Katherine's To-Do</title>
    <link rel="icon" type="image/x-icon" href="todo.png">
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Top Navbar -->
    <nav class="kid-navbar sticky-top">
        <span class="kid-brand">🌟 Katherine's To-Do</span>
        <div class="kid-nav-buttons">
            <button class="kid-nav-btn" data-bs-toggle="modal" data-bs-target="#createTaskModal">
                ✏️ New Task
            </button>
            <button class="kid-nav-btn active" data-view="tasks" onclick="showView('tasks')">
                📋 Tasks
            </button>
            <button class="kid-nav-btn" data-view="history" onclick="showView('history')">
                🏆 History
            </button>
        </div>
    </nav>

    <main class="container py-4">

        <!-- Tasks View -->
        <div id="tasksView">

            <!-- Week Tabs -->
            <ul class="nav nav-tabs week-tabs" id="weekTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#thisWeek" type="button" role="tab">
                        🌟 This Week
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" data-bs-toggle="tab" data-bs-target="#lastWeek" type="button" role="tab">
                        📅 Last Week
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" data-bs-toggle="tab" data-bs-target="#twoWeeksAgo" type="button" role="tab">
                        🗓️ Two Weeks Ago
                    </button>
                </li>
            </ul>

            <div class="tab-content tab-body" id="weekTabContent">

                <!-- This Week -->
                <div class="tab-pane fade show active" id="thisWeek" role="tabpanel">
                    <h2 class="section-title text-success">⭐ Tasks To Do</h2>
                    <div id="thisWeekActive" class="row"></div>
                    <h2 class="section-title text-muted">🎉 Completed</h2>
                    <div id="thisWeekCompleted" class="row"></div>
                </div>

                <!-- Last Week -->
                <div class="tab-pane fade" id="lastWeek" role="tabpanel">
                    <h2 class="section-title text-success">⭐ Tasks To Do</h2>
                    <div id="lastWeekActive" class="row"></div>
                    <h2 class="section-title text-muted">🎉 Completed</h2>
                    <div id="lastWeekCompleted" class="row"></div>
                </div>

                <!-- Two Weeks Ago -->
                <div class="tab-pane fade" id="twoWeeksAgo" role="tabpanel">
                    <h2 class="section-title text-success">⭐ Tasks To Do</h2>
                    <div id="twoWeeksAgoActive" class="row"></div>
                    <h2 class="section-title text-muted">🎉 Completed</h2>
                    <div id="twoWeeksAgoCompleted" class="row"></div>
                </div>

            </div>

        </div>

        <!-- History View -->
        <div id="historyView" style="display:none;">

            <!-- Week Tabs -->
            <ul class="nav nav-tabs week-tabs mt-3" id="historyWeekTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" data-bs-toggle="tab"
                            data-bs-target="#histThisWeek" type="button" role="tab">
                        🌟 This Week
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" data-bs-toggle="tab"
                            data-bs-target="#histLastWeek" type="button" role="tab">
                        📅 Last Week
                    </button>
                </li>
            </ul>

            <div class="tab-content tab-body" id="historyTabContent">
                <div class="tab-pane fade show active" id="histThisWeek" role="tabpanel">
                    <div id="histThisWeekContent" class="history-tab-content"></div>
                </div>
                <div class="tab-pane fade" id="histLastWeek" role="tabpanel">
                    <div id="histLastWeekContent" class="history-tab-content"></div>
                </div>
            </div>

            <!-- Badges always visible (spans both weeks) -->
            <div class="history-badges-section mt-4 p-4">
                <h2 class="history-section-heading text-center mb-4">🏅 Your Badges</h2>
                <div id="badgesGrid" class="badges-grid"></div>
            </div>

        </div>

    </main>

    <!-- Create Task Modal -->
    <div class="modal fade" id="createTaskModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content create-modal">

                <div class="modal-header border-0 pb-0">
                    <h3 class="modal-title fw-bold">🎨 New Task</h3>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" style="font-size:1.4rem;"></button>
                </div>

                <div class="modal-body pt-2 pb-4 px-4">
                    <input type="text" id="title" class="form-control form-control-lg mb-3"
                        placeholder="What do you want to do? 🤔">

                    <div class="mb-4">
                        <label for="taskCount" class="form-label fw-bold">🔢 How many times?</label>
                        <input type="number" id="taskCount" class="form-control form-control-lg"
                            min="1" max="10" value="1">
                    </div>

                    <div id="tagButtons" class="mb-4"></div>

                    <button onclick="createTask()" class="btn btn-primary btn-lg w-100 add-task-btn">
                        ➕ Add Task!
                    </button>
                </div>

            </div>
        </div>
    </div>

    <!-- Task Detail Modal -->
    <div class="modal fade" id="taskDetailModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content detail-modal">

                <div class="modal-header border-0 pb-0">
                    <h3 class="modal-title fw-bold">✏️ Task Details</h3>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" style="font-size:1.4rem;"></button>
                </div>

                <div class="modal-body pt-2 pb-4 px-4">
                    <!-- Task Title (Editable) -->
                    <input type="text" id="detailTitle" class="form-control form-control-lg mb-4"
                        placeholder="Task title...">

                    <!-- Completion Status -->
                    <div id="completionStatus" class="mb-4"></div>

                    <!-- Tags Section -->
                    <h5 class="fw-bold mb-2">🏷️ Tags</h5>
                    <div id="detailTagButtons" class="mb-4"></div>

                    <!-- Action Buttons -->
                    <div class="d-grid gap-2">
                        <button onclick="saveTaskChanges()" class="btn btn-success btn-lg save-task-btn">
                            💾 Save Changes
                        </button>
                        <button onclick="deleteTask()" class="btn btn-danger btn-lg delete-task-btn">
                            🗑️ Delete Task
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script src="app.js"></script>
</body>

</html>
